[project]
name = "chexu"
version = "0.14.0"
description = "An agent application for used-car dealers"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "anyio>=4,<5",
    "fastapi>=0.162.0",
    "httpx>=0.28,<1",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3,<4",
    "markitdown[docx,pdf]>=0.1,<1",
    "mcp>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
